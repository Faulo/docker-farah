name: Docker

on:
    push:
        branches:
            - "main"
        paths:
            - "linux/**"
            - "windows/**"
            - ".github/workflows/docker.yml"
    workflow_dispatch:
    schedule:
        - cron: "0 0 1 * *"

permissions:
    contents: read

concurrency:
    group: docker-publish
    cancel-in-progress: false

jobs:
    configuration:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{steps.image.outputs.DOCKER_IMAGE}}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read image name
              id: image
              shell: bash
              run: grep -m1 '^DOCKER_IMAGE=' .env >> "${GITHUB_OUTPUT}"

    publish:
        needs: configuration
        strategy:
            fail-fast: false
            matrix:
                variant:
                    - tag: "8.2"
                      build_args:
                          PHP_VERSION: "8.2"
                          DEBIAN: bookworm
                    - tag: "8.3"
                      build_args:
                          PHP_VERSION: "8.3"
                          DEBIAN: bookworm
                    - tag: "8.4"
                      build_args:
                          PHP_VERSION: "8.4"
                          DEBIAN: bookworm
                    - tag: "8.5"
                      build_args:
                          PHP_VERSION: "8.5"
                          DEBIAN: bookworm

        uses: Faulo/workflows-docker/.github/workflows/publish.yml@v1
        with:
            image: ${{needs.configuration.outputs.image}}
            tag: ${{matrix.variant.tag}}
            build_args: ${{toJSON(matrix.variant.build_args)}}
        secrets:
            DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
            DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
