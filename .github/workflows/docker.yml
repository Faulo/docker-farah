name: Docker

on:
    push:
        branches:
            - "main"
        paths:
            - "common/**"
            - "linux/**"
            - "windows/**"
            - ".dockerignore"
            - "docker-farah.sln"
            - ".github/workflows/docker.yml"
    workflow_dispatch:
    schedule:
        - cron: "0 0 1 * *"

permissions:
    contents: read

concurrency:
    group: docker-publish
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: "9.0.x"
            - name: Restore
              run: dotnet restore docker-farah.sln
            - name: Test
              run: dotnet test docker-farah.sln --configuration Release --no-restore

    configuration:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{steps.image.outputs.DOCKER_IMAGE}}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read image name
              id: image
              shell: bash
              run: grep -m1 '^DOCKER_IMAGE=' .env >> "${GITHUB_OUTPUT}"

    publish:
        needs:
            - configuration
            - test
        strategy:
            fail-fast: false
            matrix:
                variant:
                    - tag: "7.4"
                      build_args:
                          PHP_VERSION: "7.4"
                          DEBIAN: bullseye
                    - tag: "8.0"
                      build_args:
                          PHP_VERSION: "8.0"
                          DEBIAN: bullseye
                    - tag: "8.1"
                      build_args:
                          PHP_VERSION: "8.1"
                          DEBIAN: bookworm
                    - tag: "8.2"
                      build_args:
                          PHP_VERSION: "8.2"
                          DEBIAN: bookworm
                    - tag: "8.3"
                      build_args:
                          PHP_VERSION: "8.3"
                          DEBIAN: bookworm
                    - tag: "8.4"
                      build_args:
                          PHP_VERSION: "8.4"
                          DEBIAN: bookworm
                    - tag: "8.5"
                      build_args:
                          PHP_VERSION: "8.5"
                          DEBIAN: bookworm

        uses: Faulo/workflows-docker/.github/workflows/publish.yml@d10fc90d460644513d0e884ae2bdd5f84c562991
        with:
            image: ${{needs.configuration.outputs.image}}
            tag: ${{matrix.variant.tag}}
            build_args: ${{toJSON(matrix.variant.build_args)}}
            linux_platforms: '["linux/amd64","linux/arm64"]'
            linux_context: .
            windows_context: .
        secrets:
            DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
            DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
